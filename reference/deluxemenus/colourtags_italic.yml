menu_title: '&9Italic Coloured Tags Menu'
size: 45
update_interval: 1

items:
  filler:
    material: light_blue_stained_glass_pane
    slots: [0-3, 5-8, 9, 17-18, 26-27, 35, 37-43]
    display_name: '&l'
  back:
    material: COMPASS
    slot: 36
    display_name: '&6Back'
    click_commands:
    - "[openguimenu] colourtags"
  exit:
    material: IRON_DOOR
    slot: 44
    display_name: '&cExit'
    click_commands:
    - '[close]'
  head:
    material: head-%player_name%
    display_name: '&6%player_name%'
    lore:
    - '&fPoints: &d%votingplugin_points%'
    slot: 4
    update: true
  black:
    material: name_tag
    display_name: '&0&oBlack Tag'
    lore:
    - '&fCost: &d10'
    slot: 10
    click_requirement:
      requirements:
        points:
          type: javascript
          expression: '%votingplugin_points% >= 10'
          deny_commands:
          - '[message] &cYou do not have enough vote points to buy this!'
        inventory:
          type: string equals
          input: '%player_has_empty_slot%'
          output: 'yes' # Put 'yes' to make sure player has an empty slot, otherwise put 'no' to make sure the player has a full inventory
          deny_commands:
          - '[message] &cYour inventory is full!'   
    click_commands:
    - '[console] av User %player_name% RemovePoints 10'
    - '[console] ct give %player_name% black 1 i'
