  lore-owned: "<green>Owned"
  lore-use: "<gray>Click to use"
  lore-price: "<gray>Price: <yellow><price> SkyCoins"
  lore-buy: "<green>Click to buy"
  lore-unaffordable: "<red>Not enough coins (<coins>/<price>)"
  locked-name: "<red>Locked"
  back: "<yellow>Back"
  close: "<red>Close"
  next-page: "<yellow>Next page"
  prev-page: "<yellow>Previous page"
  page: "<gray>Page <yellow><page></yellow>/<yellow><pages>"
