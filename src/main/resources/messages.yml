# Admin
admin:
  reloaded: "Reloaded catalog: <categories> categories, <items> items (<problems> problems; see console)."
  usage: "<gray>Usage: <yellow>/cosmeticshop reload | list | info <item> | give <player> <item> | revoke <player> <item>"
  unknown-item: "<red>Unknown item '<item>'.</red>"
  list-line: "<yellow><category></yellow> <gray>(<count> items)"
  info-line: "<gray><key>: <white><value>"
