# MiniMessage strings. <placeholders> are filled by the plugin.
prefix: "<gold>[SkyShop]</gold> "

# Wallet
balance: "You have <yellow><coins></yellow> SkyCoins."
balance-other: "<yellow><player></yellow> has <yellow><coins></yellow> SkyCoins."
coins-received: "<green>Received <yellow><amount></yellow> SkyCoins.</green>"
coins-queued: "<yellow><amount></yellow> SkyCoins are waiting for inventory space. Free some slots and run <yellow>/skycoins claim</yellow>."
coins-claimed: "<green>Claimed <yellow><amount></yellow> SkyCoins.</green>"
nothing-to-claim: "You have no SkyCoins waiting."
coins-taken: "<red><amount></red> SkyCoins were removed from your inventory."
coins-converted: "<green>Converted <yellow><amount></yellow> old tokens into SkyCoins.</green>"
coins-nothing-to-convert: "No old tokens found in the inventory."
coins-legacy-disabled: "<red>Legacy coin conversion is disabled in config.yml (legacy-coins.enabled).</red>"

# Wallet admin / store
skycoins-usage: "<gray>Usage: <yellow>/skycoins balance [player] | claim | give <player|uuid> <amount> [reason] [txn:<id>] | take <player> <amount> [reason] | convertlegacy [player] | inspect | audit"
coins-given: "Gave <yellow><amount></yellow> SkyCoins to <yellow><player></yellow>: <result>."
coins-give-failed: "<red>Could not credit <player>; see console.</red>"
coins-duplicate-txn: "<red>Transaction <txn> was already delivered; nothing given.</red>"
coins-taken-admin: "Took <yellow><amount></yellow> SkyCoins from <yellow><player></yellow>."
coins-take-not-enough: "<red><player> only has <coins> SkyCoins.</red>"
invalid-amount: "<red>'<value>' is not a valid amount.</red>"
player-offline: "<red><player> must be online for that.</red>"
inspect-header: "<gray>Held item:"
inspect-line: "<gray>  <line>"
audit-header: "<gray>SkyCoin audit:"
audit-line: "<gray>  <key>: <white><value>"

# Shop
not-enough: "<red>You need <yellow><missing></yellow> more SkyCoins for <item>.</red>"
purchased: "<green>Purchased <item> for <yellow><price></yellow> SkyCoins!</green>"
already-owned: "<red>You already own <item>.</red>"
purchase-failed: "<red>Purchase failed and your coins were refunded. (ref <txn>)</red>"
item-unavailable: "<red>That item is no longer available.</red>"
no-permission: "<red>You don't have permission to do that.</red>"
player-only: "<red>Only players can use this command.</red>"
player-not-found: "<red>Player <player> not found. Use their UUID for players who have never joined.</red>"

